bio: |
  I'm a Ph.D. candidate in Computer Science and Engineering at the
  University of Notre Dame, advised by
  [Prof. Adam Czajka](https://engineering.nd.edu/faculty/adam-czajka/) in the
  Computer Vision Research Laboratory (CVRL). I build computer vision systems
  for medical and biometric imaging, especially for cases where data is
  limited or images are hard to work with. My work covers the full process:
  data collection, model training, evaluation, and releasing open-source tools.

  My recent work includes the first working infant iris recognition system
  for clinical use (**Best Paper Award, WACV 2025 CV4Smalls Workshop**), a
  post-mortem iris recognition model that cut error by 68% over the prior
  state of the art, and a canthi detection model now used in NIST's iris
  recognition pipeline. I'm currently working with foundation models and
  vision-language models (DINOv3, SigLIP, BioCLIP).

  I have collaborated with NIST, NIMH, Michigan State University, and the
  Medical University of Warsaw. Before Notre Dame, I was a Lecturer in
  Computer Science and Engineering at Uttara University in Dhaka, where I
  taught Algorithms, Digital Logic Design, Machine Learning, and Artificial
  Intelligence.

